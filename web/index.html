<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RasoiAI - Indian Cooking Assistant">
  <meta name="google-signin-client_id" content="2574068206-h8e0p4hih8ken82vcija66emko1jm6gn.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="rasoiai">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RasoiAI - Indian Cooking Assistant</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #111315;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .splash-emoji {
      font-size: 52px;
      animation: gentle-bounce 1.6s infinite ease-in-out;
    }
    .splash-title {
      color: #F3F4F6;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }
    .splash-subtitle {
      color: #9CA3AF;
      font-size: 13px;
    }
    .splash-spinner {
      margin-top: 8px;
      width: 26px;
      height: 26px;
      border: 2.5px solid rgba(255, 255, 255, 0.12);
      border-top-color: #2D6A4F;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes gentle-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="splash-emoji">🥘</div>
    <div class="splash-title">RasoiAI</div>
    <div class="splash-subtitle">Your Indian Cooking Assistant</div>
    <div class="splash-spinner"></div>
  </div>
  <script>
    var GOOGLE_CLIENT_ID = '2574068206-h8e0p4hih8ken82vcija66emko1jm6gn.apps.googleusercontent.com';

    window.onGoogleAuthSuccess = function(credential) {
      if (!credential) return;
      try {
        var base64Url = credential.split('.')[1];
        var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        var data = JSON.parse(jsonPayload);
        console.log('[RasoiAI] Decoded Google JWT credential:', data.email);
        window.dispatchEvent(new CustomEvent('rasoiai_google_auth', { detail: JSON.stringify(data) }));
      } catch (e) {
        console.error('Error decoding Google JWT credential:', e);
      }
    };

    window.rasoiGoogleSignIn = function() {
      if (typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) {
        console.warn('[RasoiAI] Google accounts script still loading, retrying in 300ms...');
        setTimeout(window.rasoiGoogleSignIn, 300);
        return;
      }
      try {
        var tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CLIENT_ID,
          scope: 'email profile openid',
          prompt: 'select_account',
          callback: function(tokenResponse) {
            if (tokenResponse && tokenResponse.access_token) {
              console.log('[RasoiAI] Received Google access token, fetching userinfo...');
              fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                headers: { 'Authorization': 'Bearer ' + tokenResponse.access_token }
              })
              .then(function(res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
              })
              .then(function(userInfo) {
                console.log('[RasoiAI] User info retrieved successfully:', userInfo.email);
                window.dispatchEvent(new CustomEvent('rasoiai_google_auth', {
                  detail: JSON.stringify(userInfo)
                }));
              })
              .catch(function(err) {
                console.error('[RasoiAI] Failed to fetch Google user info:', err);
              });
            } else if (tokenResponse && tokenResponse.error) {
              console.warn('[RasoiAI] Google OAuth token response error:', tokenResponse.error);
            }
          }
        });
        tokenClient.requestAccessToken({ prompt: 'select_account' });
      } catch (err) {
        console.error('[RasoiAI] Failed to initiate Google Sign In:', err);
      }
    };

    // Listen for requests from Flutter
    window.addEventListener('rasoi_request_google_signin', function() {
      console.log('[RasoiAI] Received rasoi_request_google_signin from Flutter');
      window.rasoiGoogleSignIn();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
